<!DOCTYPE html>
<html lang="en">


    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Accessible Form UI</title>
        <link rel="stylesheet" href="styles.css">
    </head>


    <body>
        <div class="form-container">
            <form action="#" method="post">
                <div class="form-group">
                    <label for="full name">Full Name</label>
                    <input type="text" id="full name" name="full name" placeholder="what is your famous name?" aria-required="true">
                </div>


                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="ulalal@email.com" aria-required="true" aria-invalid="true">
                </div>


                <div class="form-group password-container">
                    <label for="password">Enter Password</label>
                    <input type="password" id="password" name="password" aria-required="true">
                    <button type="password" class="show-password-btn" aria-label="Password is hidden" aria-required="false">
                       <svg stroke="#b0b0b0" width="15" viewBox="0 0 15 15" fill="none" xmlna="http://www.w3.org/2000/svg">
                        <path d="M7.5 11C4.80285 11 2.52952 9.62184 1.09622 7.50001C2.52952 5.37816 4.80285 4 7.5 4C10.1971 4 12.4705 
                        5.37816 13.9038 7.50001C12.4705 9.62183 10.1971 11 7.5 11ZM7.5 3C4.30786 3 1.65639 4.70638 0.0760002 7.23501C-0.0253338 7.39715 -0.0253334 7.60288 0.0760014 7.76501C1.65639 10.2936 4.30786 12 7.5 12C10.6921 12 13.3436 10.2936 14.924 7.76501C15.0253 7.60288 15.0253 7.39715 14.924 7.23501C13.3436 4.70638 10.6921 3 7.5 3ZM7.5 9.5C8.60457 9.5 9.5 8.60457 9.5 7.5C9.5 6.39543 8.60457 5.5 7.5 5.5C6.39543 5.5 5.5 6.39543 5.5 7.5C5.5 8.60457 6.39543 9.5 7.5 9.5Z" fill="#b0b0b0" fill-rule="evenodd" clip-rule="evenodd"></path>
                       </svg>
                    </button>
                </div>

                
                <div class="form-group">
                    <button type="submit" class="update-profile-btn">Update profile</button>
                </div>

                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>
                    <span class="progress-percentage">50%</span>
                </div>

                <div class="form-footer">
                    <ul class="checklist">
                        <li class="incomplete">Create Account</li>
                        <li>Update Roadmap Progress</li>
                        <li>Setup Public Profile</li>
                        <li>Complete your first project</li>
                        <li class="incomplete">Invite your Friends</li>
                    </ul>
                </div>
            </form>
        </div>
    </body>


</html>
